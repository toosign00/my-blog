name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads pnpm from packageManager in package.json, installs Node.js and
      # runs pnpm install in the same step. pnpm freezes the lockfile on CI by
      # default, so no extra flag is needed here.
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true

      # Without --write so a violation fails the job instead of being fixed.
      - name: Biome
        run: pnpm exec biome check .

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test:coverage
