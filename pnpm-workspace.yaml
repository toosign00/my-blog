  - "@biomejs/cli-win32-arm64@2.5.12"
  - "@biomejs/cli-win32-x64@2.5.12"
  - postcss@8.5.27
  - "@shikijs/core@4.5.0"
  - "@shikijs/engine-javascript@4.5.0"
  - "@shikijs/engine-oniguruma@4.5.0"
